name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "docs/RELEASES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.state.outputs.run }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag and a draft release
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is published; nothing to do."
              exit 0
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Draft $TAG found; rebuilding its assets."
            exit 0
          fi
          git config user.name "vectr-release"
          git config user.email "release@vectr.local"
          git rev-parse "$TAG" >/dev/null 2>&1 || {
            git tag -a "$TAG" -m "Vectr $VERSION"
            git push origin "$TAG"
          }
          sed "s/<version>/$VERSION/g" docs/RELEASES.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --title "Vectr: v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "run=true" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            asset: release/Vectr-*-Setup.exe
          - os: macos-latest
            script: package:mac
            asset: release/Vectr-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          shopt -s nullglob
          files=(${{ matrix.asset }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No asset matched ${{ matrix.asset }}"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish only when every asset is attached
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in $ASSETS; do
            case "$asset" in
              *Setup.exe|*arm64.dmg|*x64.dmg) ;;
              *) gh release delete-asset "$TAG" "$asset" --yes ;;
            esac
          done
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for name in Setup.exe arm64.dmg x64.dmg; do
            echo "$ASSETS" | grep -q "$name\$" || { echo "Missing $name"; exit 1; }
          done
          gh release edit "$TAG" --draft=false
          gh release edit "$TAG" --latest
