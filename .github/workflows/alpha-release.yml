name: Alpha pre-release

# The rolling pre-release: the `alpha` tag always points at `main`, the notes are `docs/RELEASES.md`,
# and the Windows installer is rebuilt and attached whenever a merge changes the release notes - which is
# the phase-close rule. A normal merge only refreshes the notes.
#
# Moving the `alpha` tag is the one force-push in the project: a tag is a label, and this label is
# defined as pointing at the head of `main`. No branch is ever force-pushed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build and attach the Windows installer
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: alpha-release
  cancel-in-progress: true

jobs:
  alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Did this change the release notes?
        id: notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qx 'docs/RELEASES.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer
        run: npm run build

      - name: Build the Windows installer
        if: steps.notes.outputs.changed == 'true' || inputs.build_installer == true
        run: npm run package:win

      - name: Move the alpha tag to main
        shell: bash
        run: |
          git config user.name "vectr-release"
          git config user.email "release@vectr.local"
          git tag -f alpha
          git push -f origin alpha

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --prerelease --title "Vectr alpha (rolling)" --notes-file docs/RELEASES.md
          else
            gh release create alpha --prerelease --title "Vectr alpha (rolling)" --notes-file docs/RELEASES.md
          fi

      - name: Attach the installer, replacing any older one
        if: steps.notes.outputs.changed == 'true' || inputs.build_installer == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One installer per release: the rolling tag should not accumulate one per phase forever.
          for asset in $(gh release view alpha --json assets --jq '.assets[].name' | grep -E '^Vectr-.*-Setup\.exe$' || true); do
            gh release delete-asset alpha "$asset" --yes
          done
          gh release upload alpha release/Vectr-*-Setup.exe --clobber
          gh release view alpha --json assets --jq '.assets[].name' | sed 's/^/attached: /'
