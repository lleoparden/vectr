labels:
  - name: "type: bug"
    color: "d73a4a"
    description: "Something is not working as intended"
  - name: "type: feature"
    color: "a2eeef"
    description: "A proposed product capability"
  - name: "type: epic"
    color: "6f42c1"
    description: "Tracks one master-plan phase from start to exit"
  - name: "type: task"
    color: "c5def5"
    description: "A bounded, approved slice of a phase epic"
  - name: "area: editor"
    color: "1d76db"
    description: "Canvas, tools, layers, or selection"
  - name: "area: compiler"
    color: "5319e7"
    description: "Layer-to-React or Tailwind export"
  - name: "area: auth"
    color: "0e8a16"
    description: "Accounts, access, or Supabase identity"
  - name: "area: projects"
    color: "006b75"
    description: "Saved design projects or storage"
  - name: "area: renderer"
    color: "d4c5f9"
    description: "Rasterization, GPU/WASM surfaces, and memory budgets"
  - name: "area: documents"
    color: "c2e0c6"
    description: "Document model, commands, history, and local files"
  - name: "status: needs-plan"
    color: "fbca04"
    description: "Needs an approved plan before implementation"
  - name: "status: blocked"
    color: "b60205"
    description: "Cannot proceed without a decision or external change"
  - name: "priority: high"
    color: "e99695"
    description: "Should be addressed soon"
  - name: "agent-ready"
    color: "bfdadc"
    description: "Clear enough for an agent to begin approved work"
